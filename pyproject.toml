[project]
name = "hala-arab"
version = "0.4.0"
description = "HALA - Hunting Arab Leaks & Assets | أول إطار عربي مفتوح المصدر لاستخبارات التهديدات"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "HALA Community" }]
dependencies = [
    "click>=8.1",
    "httpx>=0.27",
    "rich>=13.7",
    "phonenumbers>=8.13",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
hala = "hala.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hala"]
